<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required for env(safe-area-inset-*) to be non-zero on iOS, so the scroll
         pill clears the home indicator and the nav island clears the notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anshad — Senior UX &amp; Product Designer</title>
    <meta name="description" content="Anshad (an5had) — Senior UX & Product Designer. 5+ years shaping enterprise platforms, data-heavy dashboards and AI-powered products. Currently at Exult Global." />
    <!-- ?v= busts browsers' long-lived favicon cache so the old mark doesn't linger -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="theme-color" content="#000000" />
    <!-- Share thumbnail: scrapers (LinkedIn, WhatsApp, X, Slack) need an absolute URL -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://itsmyportfolio.com/" />
    <meta property="og:site_name" content="an5had" />
    <meta property="og:title" content="Anshad — Senior UX & Product Designer" />
    <meta property="og:description" content="I bring messy problems into focus — and design products people actually understand." />
    <meta property="og:image" content="https://itsmyportfolio.com/og.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="an5had logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anshad — Senior UX & Product Designer" />
    <meta name="twitter:description" content="I bring messy problems into focus — and design products people actually understand." />
    <meta name="twitter:image" content="https://itsmyportfolio.com/og.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // One-time cleanup: drop any stale service worker or cache from the previous site
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) {
            ks.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
